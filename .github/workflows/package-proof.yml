name: Validate packages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            binary: dist/policy-mcp
          - runner: windows-2025
            target: windows-x64
            binary: dist/policy-mcp.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run pyinstaller --noconfirm --clean policy-mcp.spec
      - run: uv run policy-mcp package --binary ${{ matrix.binary }} --output dist/packages --target ${{ matrix.target }}
      - name: Exercise the packaged MCP servers
        run: uv run pytest tests/test_release_artifacts.py
        env:
          SOURCEBOOK_TEST_BINARY: ${{ matrix.binary }}
          SOURCEBOOK_TEST_PACKAGES: dist/packages
          SOURCEBOOK_TEST_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sourcebook-${{ matrix.target }}
          path: dist/packages
          if-no-files-found: error
