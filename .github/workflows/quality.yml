name: Quality

on:
  pull_request:
  push:
  schedule:
    - cron: "17 6 * * 2"

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest
      - run: uv build
      - run: uv run policy-mcp verify-schemas
      - name: Verify frozen source contracts
        run: >-
          uv run pytest
          tests/test_dip_adapter.py
          tests/test_eu_sources.py
          tests/test_genesis_adapter.py
          tests/test_govdata_adapter.py
          tests/test_german_records.py
