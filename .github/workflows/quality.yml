name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest
      - run: uv build
      - run: uv run policy-mcp verify-schemas
      - name: Verify frozen source contracts
        run: >-
          uv run pytest
          tests/test_dip_adapter.py
          tests/test_eu_sources.py
          tests/test_genesis_adapter.py
          tests/test_govdata_adapter.py
          tests/test_german_records.py
